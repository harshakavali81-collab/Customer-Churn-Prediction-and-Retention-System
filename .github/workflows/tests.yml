name: Test churn project
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.pipeline
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m src.export_browser --output browser-demo/dist
      - run: node --check browser-demo/dist/app.mjs
      - run: node --check browser-demo/dist/core.mjs
      - run: node test-parity.mjs
        working-directory: browser-demo
